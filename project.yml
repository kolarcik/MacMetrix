name: MacMetrix
options:
  bundleIdPrefix: tech.synot
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    # Change to your Apple Developer team. The App Group is team-prefixed so it
    # works with Developer ID signing without a provisioning profile.
    DEVELOPMENT_TEAM: 3ZN9TSG9S7
    APP_GROUP_ID: $(DEVELOPMENT_TEAM).tech.synot.MacMetrix
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: 2
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  MacMetrix:
    type: application
    platform: macOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.synot.MacMetrix
        PRODUCT_NAME: MacMetrix
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: MacMetrix
        LSUIElement: true
        AppGroupID: $(APP_GROUP_ID)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: "© 2026 Luděk Kolarčík"
    entitlements:
      path: App/MacMetrix.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    dependencies:
      - target: MacMetrixWidget
        embed: true

  MacMetrixWidget:
    type: app-extension
    platform: macOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.synot.MacMetrix.Widget
        PRODUCT_NAME: MacMetrixWidget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: MacMetrix
        AppGroupID: $(APP_GROUP_ID)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/MacMetrixWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
