name: MacMetrix
options:
  bundleIdPrefix: tech.synot
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    # Change to your Apple Developer team. The App Group is team-prefixed so it
    # works with Developer ID signing without a provisioning profile.
    DEVELOPMENT_TEAM: 3ZN9TSG9S7
    APP_GROUP_ID: $(DEVELOPMENT_TEAM).tech.synot.MacMetrix
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: 3
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  MacMetrix:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
      - Helper/HelperProtocol.swift
      - Helper/ProcReader.swift
      # launchd plist of the privileged helper, registered with SMAppService.daemon
      - path: LaunchDaemons/tech.synot.MacMetrix.Helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.synot.MacMetrix
        PRODUCT_NAME: MacMetrix
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: MacMetrix
        LSUIElement: true
        AppGroupID: $(APP_GROUP_ID)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: "© 2026 Luděk Kolarčík"
    entitlements:
      path: App/MacMetrix.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    dependencies:
      - target: MacMetrixWidget
        embed: true
      - target: MacMetrixHelper
        embed: true
        codeSign: true
        copy:
          destination: executables

  MacMetrixWidget:
    type: app-extension
    platform: macOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.synot.MacMetrix.Widget
        PRODUCT_NAME: MacMetrixWidget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: MacMetrix
        AppGroupID: $(APP_GROUP_ID)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/MacMetrixWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)

  # Read-only privileged helper (launchd daemon), see Helper/HelperProtocol.swift.
  MacMetrixHelper:
    type: tool
    platform: macOS
    sources: [Helper]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.synot.MacMetrix.Helper
        PRODUCT_NAME: MacMetrixHelper
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES
    info:
      path: Helper/Info.plist
      properties:
        CFBundleIdentifier: tech.synot.MacMetrix.Helper
        CFBundleName: MacMetrixHelper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
